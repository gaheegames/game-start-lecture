<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>게임을 보는 법 | GAME VIEW</title>

<body>

  <header class="topbar">

      <a class="logo" href="index.html"><b>G</b><span>GAME VIEW</span></a>
      <div class="menu">
        <a href="index.html" aria-current="page">시작</a>

  <main id="main">
    <section class="cover">
      <div class="cover-inner">
        <div>

          <h1>게임을<br>보는 법</h1>

        </div>
        <div class="cover-visual" aria-label="규칙, 동기, 보상의 순환 구조">
          <div class="orbit">
            <div class="orbit-center">플레이</div>
            <span class="orbit-word rule">규칙</span>
            <span class="orbit-word motive">동기</span>
            <span class="orbit-word reward">보상</span>

    <section class="speaker">

          <p class="kicker">LECTURER</p>

          <div class="career-line" aria-label="강의자 경험 분야">

            <div><strong>사업</strong><span>소싱과 퍼블리싱 검토</span></div>
            <div><strong>교육</strong><span>대학 강의와 창업 경험</span></div>
          </div>
        </div>
      </div>
    </section>

  <footer class="footer"><div class="footer-inner"><strong>GAME VIEW</strong><span>© <span data-year></span> 구현우</span></div></footer>
